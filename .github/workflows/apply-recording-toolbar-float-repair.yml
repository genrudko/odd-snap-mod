name: Apply floating recording toolbar repair

on:
  push:
    branches:
      - feature/snipping-launcher
    paths:
      - tools/apply_recording_toolbar_float_repair.py
      - .github/workflows/apply-recording-toolbar-float-repair.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/snipping-launcher
          fetch-depth: 0

      - name: Apply repair
        run: python tools/apply_recording_toolbar_float_repair.py

      - name: Verify generated diff
        shell: bash
        run: |
          git diff --check
          git diff -- \
            src/OddSnap/Capture/RecordingToolbarForm.cs \
            src/OddSnap/Capture/RecordingForm.Recording.cs \
            src/OddSnap/Capture/RecordingForm.WindowTracking.cs

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore OddSnap.sln

      - name: Build
        run: dotnet build OddSnap.sln -c Release --no-restore --verbosity minimal

      - name: Test
        run: dotnet test src/OddSnap.Tests/OddSnap.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      - name: Commit generated source
        shell: bash
        run: |
          if git diff --quiet -- \
            src/OddSnap/Capture/RecordingToolbarForm.cs \
            src/OddSnap/Capture/RecordingForm.Recording.cs \
            src/OddSnap/Capture/RecordingForm.WindowTracking.cs; then
            echo "No source changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/OddSnap/Capture/RecordingToolbarForm.cs \
            src/OddSnap/Capture/RecordingForm.Recording.cs \
            src/OddSnap/Capture/RecordingForm.WindowTracking.cs
          git commit -m "fix: make recording toolbar movable and translucent"
          git push origin HEAD:feature/snipping-launcher
