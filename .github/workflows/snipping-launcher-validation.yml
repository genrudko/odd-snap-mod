name: Snipping launcher validation

on:
  push:
    branches:
      - feature/snipping-launcher
  pull_request:
    branches:
      - feature/recording-capture-targets
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/snipping-launcher
          fetch-depth: 0

      - name: Apply recording launcher repairs
        run: |
          python tools/apply_snipping_launcher_repair3.py
          python tools/apply_snipping_start_handoff_repair4.py
          python tools/apply_preselected_recording_start_repair5.py
          python tools/apply_snipping_overlay_close_handoff_repair6.py

      - name: Verify generated diff
        shell: bash
        run: |
          git diff --check
          git diff -- \
            src/OddSnap/Capture/RegionOverlayForm.Input.Tools.cs \
            src/OddSnap/Capture/RegionOverlayForm.Input.Helpers.cs \
            src/OddSnap/App/App.Capture.cs \
            src/OddSnap/Capture/RecordingForm.cs \
            src/OddSnap/Capture/RecordingForm.Targets.cs \
            src/OddSnap.Tests/SnippingRecordingStartTests.cs

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore solution
        run: dotnet restore OddSnap.sln

      - name: Build solution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $output = dotnet build OddSnap.sln -c Release --no-restore --verbosity quiet 2>&1
          $exitCode = $LASTEXITCODE
          $output | Set-Content -Path artifacts/build-full.log -Encoding utf8
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Run tests
        run: dotnet test src/OddSnap.Tests/OddSnap.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      - name: Commit generated source changes
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- \
            src/OddSnap/Capture/RegionOverlayForm.Input.Tools.cs \
            src/OddSnap/Capture/RegionOverlayForm.Input.Helpers.cs \
            src/OddSnap/App/App.Capture.cs \
            src/OddSnap/Capture/RecordingForm.cs \
            src/OddSnap/Capture/RecordingForm.Targets.cs \
            src/OddSnap.Tests/SnippingRecordingStartTests.cs; then
            echo "No generated source changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              src/OddSnap/Capture/RegionOverlayForm.Input.Tools.cs \
              src/OddSnap/Capture/RegionOverlayForm.Input.Helpers.cs \
              src/OddSnap/App/App.Capture.cs \
              src/OddSnap/Capture/RecordingForm.cs \
              src/OddSnap/Capture/RecordingForm.Targets.cs \
              src/OddSnap.Tests/SnippingRecordingStartTests.cs
            git commit -m "fix: close snipping overlay before recording starts"
            git push origin HEAD:feature/snipping-launcher
          fi

      - name: Publish portable Windows x64 build
        run: dotnet publish src/OddSnap/OddSnap.csproj -c Release -r win-x64 --self-contained false -o artifacts/OddSnap-Mod-win-x64

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: OddSnap-SnippingLauncher-win-x64
          path: artifacts/OddSnap-Mod-win-x64
          if-no-files-found: error
          retention-days: 14

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snipping-launcher-build-log
          path: artifacts/build-full.log
          if-no-files-found: ignore
          retention-days: 7