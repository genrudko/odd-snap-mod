name: Snipping launcher validation

on:
  push:
    branches:
      - feature/snipping-launcher
  pull_request:
    branches:
      - feature/recording-capture-targets
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/snipping-launcher
          fetch-depth: 0

      - name: Apply recording toolbar opacity settings
        run: |
          python tools/apply_recording_toolbar_opacity_constructor_prepatch.py
          python tools/apply_recording_toolbar_opacity_method_prepatch.py
          python tools/apply_recording_toolbar_opacity_properties_prepatch.py
          python tools/apply_recording_toolbar_opacity_fields_prepatch.py
          python tools/apply_recording_toolbar_opacity_settings_repair10.py
          python tools/apply_recording_toolbar_opacity_code_postpatch.py

      - name: Verify generated diff
        shell: bash
        run: |
          git diff --check
          git diff -- \
            src/OddSnap/Models/AppSettings.cs \
            src/OddSnap/App/App.Capture.cs \
            src/OddSnap/Capture/RecordingForm.cs \
            src/OddSnap/Capture/RecordingToolbarForm.cs \
            src/OddSnap/UI/SettingsWindow.xaml \
            src/OddSnap/UI/SettingsWindow.RecordingToolbarOpacity.cs \
            src/OddSnap.Tests/RecordingToolbarOpacityTests.cs

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore solution
        run: dotnet restore OddSnap.sln

      - name: Build solution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $output = dotnet build OddSnap.sln -c Release --no-restore --verbosity quiet 2>&1
          $exitCode = $LASTEXITCODE
          $output | Set-Content -Path artifacts/build-full.log -Encoding utf8
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Run tests
        shell: pwsh
        run: |
          $output = dotnet test src/OddSnap.Tests/OddSnap.Tests.csproj -c Release --no-build --logger "console;verbosity=normal" 2>&1
          $exitCode = $LASTEXITCODE
          $output | Set-Content -Path artifacts/test-full.log -Encoding utf8
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Commit generated source changes
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- \
            src/OddSnap/Models/AppSettings.cs \
            src/OddSnap/App/App.Capture.cs \
            src/OddSnap/Capture/RecordingForm.cs \
            src/OddSnap/Capture/RecordingToolbarForm.cs \
            src/OddSnap/UI/SettingsWindow.xaml \
            src/OddSnap/UI/SettingsWindow.RecordingToolbarOpacity.cs \
            src/OddSnap.Tests/RecordingToolbarOpacityTests.cs; then
            echo "No generated source changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              src/OddSnap/Models/AppSettings.cs \
              src/OddSnap/App/App.Capture.cs \
              src/OddSnap/Capture/RecordingForm.cs \
              src/OddSnap/Capture/RecordingToolbarForm.cs \
              src/OddSnap/UI/SettingsWindow.xaml \
              src/OddSnap/UI/SettingsWindow.RecordingToolbarOpacity.cs \
              src/OddSnap.Tests/RecordingToolbarOpacityTests.cs
            git commit -m "feat: add recording toolbar opacity settings"
            git push origin HEAD:feature/snipping-launcher
          fi

      - name: Publish portable Windows x64 build
        run: dotnet publish src/OddSnap/OddSnap.csproj -c Release -r win-x64 --self-contained false -o artifacts/OddSnap-Mod-win-x64

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: OddSnap-SnippingLauncher-win-x64
          path: artifacts/OddSnap-Mod-win-x64
          if-no-files-found: error
          retention-days: 14

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snipping-launcher-validation-logs
          path: |
            artifacts/build-full.log
            artifacts/test-full.log
          if-no-files-found: ignore
          retention-days: 7
