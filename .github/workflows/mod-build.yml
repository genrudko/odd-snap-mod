name: OddSnap Mod Validation

on:
  push:
    branches:
      - feature/recording-capture-targets
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Build, test, and publish Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore solution
        run: dotnet restore OddSnap.sln

      - name: Build solution
        run: dotnet build OddSnap.sln -c Release --no-restore

      - name: Run tests
        run: dotnet test src/OddSnap.Tests/OddSnap.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish portable Windows x64 build
        run: >
          dotnet publish src/OddSnap/OddSnap.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          --no-restore
          -o artifacts/OddSnap-Mod-win-x64

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: OddSnap-Mod-win-x64
          path: artifacts/OddSnap-Mod-win-x64/
          if-no-files-found: error
          retention-days: 14
