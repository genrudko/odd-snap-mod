name: Source snapshot

on:
  push:
    branches:
      - feature/snipping-launcher
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Upload source tree
        uses: actions/upload-artifact@v4
        with:
          name: odd-snap-source
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
