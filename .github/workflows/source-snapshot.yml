name: Snipping launcher validation

on:
  push:
    branches:
      - feature/snipping-launcher
  pull_request:
    branches:
      - feature/recording-capture-targets
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/snipping-launcher
          fetch-depth: 0

      - name: Apply snipping launcher source patch
        run: |
          python tools/apply_snipping_launcher_stage1.py
          python tools/apply_snipping_launcher_repair1.py

      - name: Exclude workflow-only validation change
        shell: pwsh
        run: git checkout -- .github/workflows/mod-build.yml

      - name: Show generated changes
        shell: bash
        run: |
          git status --short
          git diff --check
          git diff --name-only

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore solution
        run: dotnet restore OddSnap.sln

      - name: Build solution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $output = dotnet build OddSnap.sln -c Release --no-restore --verbosity quiet 2>&1
          $exitCode = $LASTEXITCODE
          $output | Set-Content -Path artifacts/build-full.log -Encoding utf8
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Run tests
        run: dotnet test src/OddSnap.Tests/OddSnap.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish portable Windows x64 build
        run: dotnet publish src/OddSnap/OddSnap.csproj -c Release -r win-x64 --self-contained false -o artifacts/OddSnap-Mod-win-x64

      - name: Commit generated source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/snipping-launcher-stage1.md src/OddSnap
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "feat: add Snipping Tool-style capture launcher"
            git push origin HEAD:feature/snipping-launcher
          fi

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: OddSnap-SnippingLauncher-win-x64
          path: artifacts/OddSnap-Mod-win-x64
          if-no-files-found: error
          retention-days: 14

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snipping-launcher-build-log
          path: artifacts/build-full.log
          if-no-files-found: ignore
          retention-days: 7
