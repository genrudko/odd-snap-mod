name: Source snapshot

on:
  push:
    branches:
      - feature/snipping-launcher
  pull_request:
    branches:
      - feature/recording-capture-targets
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/snipping-launcher
          fetch-depth: 0

      - name: Apply snipping launcher source patch
        run: python tools/apply_snipping_launcher_stage1.py

      - name: Commit generated source changes
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/workflows/mod-build.yml docs/snipping-launcher-stage1.md src/OddSnap
            git commit -m "feat: add Snipping Tool-style capture launcher"
            git push origin HEAD:feature/snipping-launcher
          else
            echo "No source changes to commit."
          fi

      - name: Upload source tree
        uses: actions/upload-artifact@v4
        with:
          name: odd-snap-source
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
