name: Apply recording target source patch

on:
  push:
    branches:
      - feature/recording-capture-targets
    paths:
      - tools/apply_recording_monitor_source_patch.py
      - tools/apply_recording_pause_repair.py
      - .github/workflows/apply-recording-monitor-source-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/recording-capture-targets
          fetch-depth: 0

      - name: Apply source patches
        run: |
          python tools/apply_recording_monitor_source_patch.py
          python tools/apply_recording_pause_repair.py

      - name: Commit generated source changes
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) {
            Write-Host "No source changes to commit."
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add `
            src/OddSnap/Models/AppSettings.cs `
            src/OddSnap/App/App.Capture.cs `
            src/OddSnap/Capture/RecordingForm.cs `
            src/OddSnap/Capture/RecordingForm.Recording.cs `
            src/OddSnap/Capture/RecordingToolbarForm.cs `
            src/OddSnap/Capture/RecordingPauseClock.cs `
            src/OddSnap/Capture/RecordingWindowTargetSelector.cs `
            src/OddSnap/Capture/ScreenCapture.cs `
            src/OddSnap/Capture/VideoRecorder.cs `
            src/OddSnap/Capture/GifRecorder.cs `
            src/OddSnap/Helpers/RecordingTargetIconData.cs
          git commit -m "feat: add recording pause and target-aware toolbar"
          git push origin HEAD:feature/recording-capture-targets